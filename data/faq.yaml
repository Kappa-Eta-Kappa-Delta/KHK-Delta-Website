# Rush page FAQ accordion. Add/remove/reorder entries here — the
# rush page just loops over this list in order.
- question: "Do I need to be an Engineering or Computer Science major?"
  answer: "No. Although many members come from STEM majors, especially Engineering, Computer Science, and Data Science, KHK is open to students from any major who are interested in the chapter and its values."
- question: "What should I wear to rush events?"
  answer: "Come in casual, comfortable clothing unless an event note says otherwise. If you are unsure, business casual is always a safe choice."
- question: "Do I have to attend every rush event?"
  answer: "Attending multiple events is strongly encouraged to help you meet more members and understand the chapter. If you have conflicts, come to as many as you can and reach out to the publicity chairs."
- question: "What do members look for during rush?"
  answer: "We always look for people who are respectful and interested in being part of a positive community. We care most about how you connect with people and whether the chapter feels like a good fit for you."
- question: "How can I stay updated on rush changes?"
  answer: "Sign up below to stay updated about rush information and follow our Instagram! If dates or locations change, we will post the latest information as soon as possible across all our mediums."
