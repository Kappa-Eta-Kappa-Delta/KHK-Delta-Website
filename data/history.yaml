# "Our History" timeline shown on the About page.
# Add/remove/reorder entries here — the about page just loops over
# this list in order. `id` must be unique (used for the collapsible
# section's element id).
- id: "1923"
  summary: "1923: KHK's Founding"
  image: "assets/img/executive_board.jpg"
  image_alt: "KHK in 1923"
  text: >
    On February 10th, 1923, the first chapter of KHK was born at the University
    of Iowa, led by Clinton Smoke, Theodore D. Pals, George C.K. Johnson, and
    Herbert K. Shore. A legacy spanning over a hundred years begins&hellip;
  image_side: "left"

- id: "1924"
  summary: "1924: Delta Chapter's Founding"
  image: "assets/img/org_fair_table.jpg"
  image_alt: "KHK in 1924"
  text: >
    After an inquiry from Mr. Welch of the University of Wisconsin regarding installing an electrical
    fraternity on campus, the Alpha and Beta chapters of KHK informed them of their organziation.
    In due time,  Mr. George C. K. Johnson of Alpha, Mr. Orville H. Pullen of
    Alpha, and Mr. Laurence C. Warren of Beta installed Delta chapter at the Madison Club, Madison, 
    Wisconsin on February 9,1924.
  image_side: "right"

- id: "1930"
  summary: "1930: The Great Depression"
  image: "assets/img/resume_workshop.jpg"
  image_alt: "KHK in 1930"
  text: >
    The Great Depression marked a difficult period for KHK. Alpha chapter's members dwindled, while Epsilon
    chapter had issues starting out. Due to disagreements in philosophy Eta chapter was shut down. However,
    the remaining chapters stayed resilient.
  image_side: "left"

- id: "1945"
  summary: "1945: The Impact of World War II"
  image: "assets/img/spring_2025_casino_night.jpg"
  image_alt: "KHK in 1945"
  text: >
    Despite its great resilience, KHK nonetheless slowly shrank as World War II continued. Many chapters
    ended due to loss in their members, with only Beta, Gamma, and Delta chapters remaining active after
    the war.
  image_side: "right"

- id: "2020"
  summary: "2020: Surviving Covid"
  image: "assets/img/Expo_Group_With_Bucky.jpeg"
  image_alt: "KHK in 2020"
  text: >
    With the world shutting down and gatherings being limited, Delta chapter was close to its end during
    the Covid Era. With record-low membership in decades, it was a tough time for the chapter. However,
    as lockdown ended, the desire to go out and meet new people was reinvigorated within the people 
    tremendously, leading to a huge influx in members that kick-started the chapter.
  image_side: "left"

- id: "2026"
  summary: "2026: A Year of Thriving"
  image: "assets/img/Expo_Group_With_Bucky.jpeg"
  image_alt: "KHK in 2026"
  text: >
    Across the 2025-2026 Academic Year, KHK Delta's members helped our National
    Committee secure not one but 2 new charters back to back - Kappa in Chicago
    and Lambda in Michigan. To cap off this landmark step forward, a team of our
    actives won 2nd place in the Engineering Expo in Spring 2026. Through
    multiple great struggles, Delta nonetheless found itself in a thriving era.
  image_side: "right"
