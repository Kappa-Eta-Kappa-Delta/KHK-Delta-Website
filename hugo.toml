baseURL = 'https://delta.khk.org/'
locale = 'en-us'

# The title of the window
title = 'Kappa Eta Kappa | Delta Chapter | UW-Madison'

# This site doesn't use tags/categories — skip generating those
# (otherwise-unused) taxonomy pages and their RSS feeds.
disableKinds = ["taxonomy", "term"]

[params]
  # The title shown in the navigation bar at the top of the screen
  navtitle = 'KHK Delta Chapter'

  # Footer contact info / social links / quick links — the single
  # place to edit these, used by layouts/_partials/footer.html.
  addressLine1 = "114 N Orchard St"
  addressLine2 = "Madison, WI 53715"
  email = "contact@delta.khk.org"
  phoneDisplay = "+1 (608) 251-7545"
  phoneHref = "tel:+16082517545"
  instagramUrl = "https://www.instagram.com/khkdelta/"
  linkedinUrl = "https://www.linkedin.com/company/kappa-eta-kappa-delta-chapter/"
  githubUrl = "https://github.com/Kappa-Eta-Kappa-Delta"
  alumniUrl = "https://daa.khk.org/"
  nationalUrl = "https://khk.org/"
  universityUrl = "https://www.wisc.edu/"

