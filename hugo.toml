# ------------------------------------------------------------------
# Module mounts
#
# The legacy site (root-level *.html/css/ + the old js/*-engine.js
# files) is fully migrated — every page now comes from content/ +
# layouts/. What's left of js/ is genuinely-still-client-side behavior
# (join form, moving employer-logo wall, member card flip/keyboard
# interactions) kept as plain static files, not build output.
#
# Defining any explicit mount replaces ALL of Hugo's implicit default
# mounts, so every standard directory Hugo needs is listed below too.
# ------------------------------------------------------------------
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "static"
    target = "static"

  # assets/sass/** -> Hugo Pipes source (resources.Get "sass/main.scss" in head.html).
  # assets/img/members/** and assets/img/members-casual/** -> also Hugo Pipes
  # source, so member-photo.html can resources.Get + Resize them (member
  # photos come straight off phones at up to several MB each; shipped raw
  # they're the main cause of the multi-second image stall on /members).
  [[module.mounts]]
    source = "assets"
    target = "assets"
    includeFiles = ["/sass/**", "/img/members/**", "/img/members-casual/**"]

  # assets/{fonts,img,logos,svg} -> copied verbatim to /assets/... in
  # the built output, matching the paths content/data already use.
  # (member/members-casual photos excluded: those are resized via the
  # Pipes mount above instead, so the multi-MB originals aren't also
  # shipped raw to /assets/img/...)
  [[module.mounts]]
    source = "assets"
    target = "static/assets"
    excludeFiles = ["/sass/**", "/img/members/**", "/img/members-casual/**"]

  # Remaining plain-JS behavior (join form, moving wall, card flip
  # interactions) -> served at /js/... unchanged.
  [[module.mounts]]
    source = "js"
    target = "static/js"
